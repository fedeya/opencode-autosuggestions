name: Release

# Push a tag like v0.1.4 to publish that version to npm and create the GitHub release.
# npm publishing uses trusted publishing (no token): the package must list this workflow as a trusted publisher on
# npmjs.com. A version that is already on npm is skipped, so the release can still be created.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Check the tag matches package.json
        working-directory: packages/opencode
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Publish to npm
        working-directory: packages/opencode
        run: |
          name=$(node -p 'require("./package.json").name')
          if npm view "$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            bun scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
